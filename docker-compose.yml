version: "3"
services:
  server:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/virtual_event_platform
      - JWT_SECRET=your_jwt_secret
  client:
    build: ./client
    ports:
      - "3000:3000"
  mongo:
    image: mongo
    ports:
      - "27017:27017"
